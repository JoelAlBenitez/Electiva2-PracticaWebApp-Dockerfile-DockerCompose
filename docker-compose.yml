
services:
  app:
    build: .
    container_name: hola-mundo-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: "123456"
      DB_NAME: hola_mundo
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    container_name: hola-mundo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: hola_mundo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -p123456
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
